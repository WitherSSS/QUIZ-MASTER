<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <g filter="url(#glow)">
    <path d="M256 100 
             C 220 100, 180 120, 160 160 
             C 140 200, 140 240, 150 280
             C 140 290, 130 310, 135 330
             C 140 350, 160 370, 180 375
             C 190 395, 210 410, 240 415
             C 250 415, 260 412, 256 400
             C 250 380, 240 360, 245 340
             C 250 320, 270 310, 280 330
             C 285 340, 295 340, 300 330
             C 310 320, 320 300, 310 280
             C 300 260, 290 240, 300 220
             C 310 200, 300 180, 280 170
             C 270 150, 270 120, 256 100 Z"
          fill="url(#brainGrad)" opacity="0.95"/>
    <path d="M256 100 
             C 292 100, 332 120, 352 160 
             C 372 200, 372 240, 362 280
             C 372 290, 382 310, 377 330
             C 372 350, 352 370, 332 375
             C 322 395, 302 410, 272 415
             C 262 415, 252 412, 256 400
             C 262 380, 272 360, 267 340
             C 262 320, 242 310, 232 330
             C 227 340, 217 340, 212 330
             C 202 320, 192 300, 202 280
             C 212 260, 222 240, 212 220
             C 202 200, 212 180, 232 170
             C 242 150, 242 120, 256 100 Z"
          fill="url(#brainGrad)" opacity="0.95"/>
  </g>

  <g filter="url(#glow)">
    <path d="M280 145 L240 240 L265 240 L235 365 L310 240 L275 240 Z"
          fill="url(#boltGrad)" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <circle cx="140" cy="220" r="6" fill="#60a5fa" filter="url(#glow)"/>
  <circle cx="372" cy="220" r="6" fill="#60a5fa" filter="url(#glow)"/>
  <circle cx="140" cy="300" r="5" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="372" cy="300" r="5" fill="#8b5cf6" filter="url(#glow)"/>

  <g stroke="#ffffff" stroke-width="0.8" opacity="0.08">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>
</svg>